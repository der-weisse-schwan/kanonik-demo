button,.btn{border-radius:4px}.pane{border-radius:8px}
button:focus-visible,.btn:focus-within,input:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-ui);font-size:13px;line-height:1.45}
.app{display:flex;flex-direction:column;min-height:100%;padding-inline:16px;padding-block:12px;gap:12px;box-sizing:border-box}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
.brand{display:flex;flex-direction:column;min-width:0;flex:1 1 260px}
.brand h1{font-size:15px;font-weight:600;margin:0;letter-spacing:.01em;display:flex;align-items:center}
.brand .docname{font-family:var(--font-mono);font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stats{display:flex;flex-wrap:wrap;gap:6px}
.stat{font-family:var(--font-mono);font-size:11.5px;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:2px 7px;font-variant-numeric:tabular-nums}
.stat b{color:var(--fg);font-weight:500}
.actions{display:flex;flex-wrap:wrap;gap:6px}
button,.btn{font:inherit;font-size:12.5px;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:5px 10px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
button:hover,.btn:hover{border-color:var(--accent)}
button:focus-visible,.btn:focus-within,input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--panel)}
button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--fg)}
.btn input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.grid{display:flex;flex:1;min-height:0;min-width:0}
.grid>.pane{flex:1 1 0px}
.splitter{flex:none;width:12px;cursor:col-resize;position:relative;touch-action:none;outline:none}
.splitter::after{content:"";position:absolute;top:50%;left:50%;width:4px;height:40px;margin:-20px 0 0 -2px;border-radius:2px;background:var(--line);transition:background .12s,height .12s,margin .12s}
.splitter:hover::after,.splitter:focus-visible::after,.splitter.drag::after{background:var(--accent);height:72px;margin-top:-36px}
.hsplit{flex:none;height:9px;cursor:row-resize;position:relative;touch-action:none;border-top:1px solid var(--line);outline:none}
.hsplit::after{content:"";position:absolute;left:50%;top:3px;width:40px;height:3px;margin-left:-20px;border-radius:2px;background:var(--line)}
.hsplit:hover::after,.hsplit:focus-visible::after,.hsplit.drag::after{background:var(--accent)}
.hsplit:focus-visible,.splitter:focus-visible,.tree:focus-visible,.viewport:focus-visible{outline:2px solid var(--focus);outline-offset:-2px}
body.resizing{user-select:none}body.resizing.col{cursor:col-resize}body.resizing.row{cursor:row-resize}
body.resizing .viewport,body.resizing .graphwrap{pointer-events:none}
.pmax{font-size:13px;line-height:1;padding:3px 7px}
@media (max-width:900px){.grid{flex-direction:column;gap:12px}.splitter{display:none}.grid>.pane{flex:none!important;height:auto}.pane.outline .tree{max-height:360px}.pane.page .viewport{height:70vh}.pane.graph{height:520px}}
.pane{background:var(--panel);border:1px solid var(--line);border-radius:8px;display:flex;flex-direction:column;min-width:0;min-height:0;height:calc(100vh - 110px);overflow:hidden}
.pane-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 10px;border-bottom:1px solid var(--line)}
.pane-head h2{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 auto 0 0;font-weight:600}
.pane-head button{padding:3px 8px;font-size:12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:5px;overflow:hidden}
.seg button{border:0;border-radius:0;padding:3px 8px}
.seg button+button{border-left:1px solid var(--line)}
/* outline */
.pane.outline{display:flex}
.tree{flex:1 1 auto;overflow:auto;padding:6px 0;min-height:120px}
.tree ul{list-style:none;margin:0;padding:0}
.tree li ul{margin-left:13px;border-left:1px solid var(--line)}
.row{display:flex;align-items:center;gap:6px;padding:2px 8px 2px 4px;cursor:pointer;border-radius:3px;margin:0 4px;min-width:0}
.row:hover{background:var(--sunk)}
.row.sel{background:var(--accent-soft);box-shadow:inset 2px 0 0 var(--accent)}
.caret{width:14px;flex:none;color:var(--muted);font-size:10px;text-align:center;user-select:none}
.dot{width:8px;height:8px;border-radius:2px;flex:none}
.lbl{font-family:var(--font-mono);font-size:10.5px;color:var(--muted);flex:none}
.snip{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row.heading .snip{font-weight:600}
.pg{font-family:var(--font-mono);font-size:10.5px;color:var(--ink-faint);flex:none;font-variant-numeric:tabular-nums}
.li-hidden>ul{display:none}
.tree .layer{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:8px 12px 3px}
/* details */
.details{flex:0 0 var(--detH,38%);min-height:0;overflow:auto;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.details h3{margin:0;font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:12px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-family:var(--font-mono);font-size:11.5px;overflow-wrap:anywhere}
.fulltext{background:var(--sunk);border-radius:5px;padding:7px 9px;font-size:12.5px;white-space:pre-wrap;overflow-wrap:anywhere}
.rels{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-family:var(--font-mono);font-size:11px;border:1px solid var(--line);border-radius:999px;padding:1px 8px;cursor:pointer;background:var(--panel);color:var(--fg);display:inline-flex;gap:5px;align-items:center}
.chip:hover{border-color:var(--accent)}
.chip .k{color:var(--muted)}
.tbl-wrap{overflow:auto;max-height:220px;border:1px solid var(--line);border-radius:5px}
.tbl-wrap table{border-collapse:collapse;font-size:11.5px;font-variant-numeric:tabular-nums}
.tbl-wrap td,.tbl-wrap th{border:1px solid var(--line);padding:2px 6px;white-space:nowrap}
.tbl-wrap th{background:var(--sunk);font-weight:600}
.muted{color:var(--muted)}
.empty{color:var(--muted);font-size:12px}
/* page */
.viewport{flex:1;overflow:auto;background:var(--sunk);position:relative;min-height:0}
.viewport svg{display:block;margin:16px auto;box-shadow:0 1px 3px rgba(0,0,0,.18),0 0 0 1px rgba(0,0,0,.06)}
.legend{display:flex;flex-wrap:wrap;gap:4px;padding:6px 10px;border-bottom:1px solid var(--line)}
.legend .chip{font-size:10.5px}
.legend .chip.off{opacity:.4;text-decoration:line-through}
.pagebox{cursor:pointer}
.pagebox rect.b{transition:fill-opacity .12s}
.pagebox:hover rect.b{fill-opacity:.22}
.wire{font-family:Georgia,"Times New Roman",serif;color:#7b7f88;overflow:hidden;line-height:1.18;word-break:break-word}
.pageno{font-family:var(--font-mono);font-size:12px;font-variant-numeric:tabular-nums;min-width:58px;text-align:center}
.tip{position:fixed;pointer-events:none;background:var(--fg);color:var(--bg);font-size:11.5px;padding:4px 7px;border-radius:4px;max-width:320px;z-index:20;line-height:1.35}
/* graph */
.graphwrap{flex:1;min-height:0;position:relative}
.graphwrap svg{width:100%;height:100%;display:block;cursor:grab}
.gnode text{font-family:var(--font-ui);font-size:10.5px;fill:var(--fg)}
.gnode{cursor:pointer}
.gnode.dim{opacity:.28}
.glink{fill:none;stroke:var(--line);stroke-width:1.2}
.grel{fill:none;stroke-width:1.4}
.grel.dim{opacity:.15}
.gorder{fill:none;stroke:var(--accent);stroke-width:1;stroke-dasharray:2 3;opacity:.7}
.gkey{position:absolute;left:8px;bottom:8px;background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:5px 8px;font-size:11px;display:flex;flex-direction:column;gap:2px;color:var(--muted)}
.gkey span{display:flex;align-items:center;gap:6px}
.gkey i{display:inline-block;width:18px;height:0;border-top:2px solid}
.drop{position:fixed;inset:0;background:color-mix(in srgb,var(--accent) 18%,transparent);border:3px dashed var(--accent);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:600;z-index:30}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:7px 12px;border-radius:6px;font-size:12.5px;z-index:40;max-width:90vw}
/* evidence focus (opened from a curator: ?el=…) */
.focusbar{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;background:var(--panel);border:1px solid var(--focus);box-shadow:inset 4px 0 0 var(--focus);border-radius:8px;padding:6px 10px;font-size:12.5px}
.focusbar .ft{font-weight:600;color:var(--focus)}
.focusbar .fc{font-family:var(--font-mono);font-size:11.5px;color:var(--muted)}
.focusbar .fq{flex:1 1 260px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.focusbar button{padding:2px 8px;font-size:12px}
.row.focus{box-shadow:inset 3px 0 0 var(--focus)}
.row.focus .snip{color:var(--focus)}
mark.q{background:color-mix(in srgb,var(--focus) 28%,transparent);color:inherit;border-radius:2px;padding:0 1px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

  <header>

  <div class="focusbar" id="focusbar" hidden></div>
  <div class="grid">

    <section class="pane outline" id="paneOutline" data-key="outline" aria-label="Document outline">
      <div class="pane-head">
        <h2>Outline</h2>
        <div class="seg" role="group" aria-label="Outline mode">
          <button id="modeSections" aria-pressed="true" title="Nest items under their headings">Sections</button>

        </div>
        <button id="btnFurn" aria-pressed="true" title="Show page headers, footers and other furniture">Furniture</button>
        <button class="pmax" data-pane="outline" aria-pressed="false" title="Maximize">⤢</button>
      </div>
      <div class="tree" id="tree" tabindex="0" role="region" aria-label="Gliederung"></div>
      <div class="hsplit" id="hsplit" role="separator" aria-orientation="horizontal" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50" aria-label="Größe der Detailansicht" tabindex="0" title="Drag to resize the details panel"></div>
      <div class="details" id="details"><div class="empty">Select an element in any view to see its properties and relationships.</div></div>
    </section>

    <!-- 2. Page -->
    <section class="pane page" id="panePage" data-key="page" aria-label="Page layout">
      <div class="pane-head">
        <h2>Page layout</h2>
        <button id="pgPrev" aria-label="Previous page">‹</button>
        <span class="pageno" id="pgLabel">–</span>
        <button id="pgNext" aria-label="Next page">›</button>
        <span class="muted" style="width:6px"></span>
        <button id="zOut" aria-label="Zoom out">−</button>
        <button id="zFit" title="Fit width">Fit</button>
        <button id="zIn" aria-label="Zoom in">+</button>
        <button id="btnOrder" aria-pressed="true" title="Show reading-order numbers">Order</button>
        <button id="btnCells" aria-pressed="true" title="Show table cell grid">Cells</button>
        <button class="pmax" data-pane="page" aria-pressed="false" title="Maximize">⤢</button>
      </div>
      <div class="legend" id="legend"></div>
      <div class="viewport" id="viewport" tabindex="0" role="region" aria-label="Seite"></div>
    </section>

    <!-- 3. Graph -->
    <section class="pane graph" id="paneGraph" data-key="graph" aria-label="Structure graph">
      <div class="pane-head">
        <h2>Structure graph</h2>
        <button id="btnRO" aria-pressed="false" title="Draw the reading-order path through leaf items">Reading order</button>
        <button id="btnRel" aria-pressed="true" title="Draw caption, footnote and reference links">Relations</button>
        <button id="gFit">Fit</button>
        <button class="pmax" data-pane="graph" aria-pressed="false" title="Maximize">⤢</button>
      </div>
      <div class="graphwrap" id="graph">
        <div class="gkey" id="gkey"></div>
      </div>
    </section>
  </div>
</div>

  if(typeof o.text==="string" && o.text) return o.text;
  if(typeof o.orig==="string" && o.orig) return o.orig;

function shortLabel(it){

function firstPage(ref, seen=new Set()){
  const it=S.M.items.get(ref); if(!it || seen.has(ref)) return null; seen.add(ref);

function boxTL(bbox, H){

/* ---------- outline tree (shared by outline pane and graph) ---------- */
function outlineTree(rootRef, mode){
  const M=S.M, seen=new Set();
  const build = r => { seen.add(r); const it=M.items.get(r); return { ref:r, kids:(it?.children||[]).filter(c=>M.items.has(c)&&!seen.has(c)).map(build) }; };
  if(!rootRef || !M.items.has(rootRef)) return null;
  if(mode==="stored") return build(rootRef);
  seen.add(rootRef);
  const root={ref:rootRef,kids:[]}; const stack=[{lvl:-1,node:root}];
  for(const c of M.items.get(rootRef).children){
    if(!M.items.has(c) || seen.has(c)) continue;
    const it=M.items.get(c), n=build(c);
    const lvl = it.label==="title" ? 0 : it.label==="section_header" ? (it.obj.level||1) : null;
    if(lvl!==null){ while(stack.length>1 && stack[stack.length-1].lvl>=lvl) stack.pop(); stack[stack.length-1].node.kids.push(n); stack.push({lvl,node:n}); }
    else stack[stack.length-1].node.kids.push(n);
  }
  return root;
}

/* ---------- outline pane ---------- */
const rowByRef = new Map();
function renderTree(){
  const el=$("tree"); el.innerHTML=""; rowByRef.clear();
  const M=S.M;
  const layers=[["Body", outlineTree(M.bodyRef,S.mode)]];
  if(S.furn && M.furnRef) layers.push(["Furniture", outlineTree(M.furnRef,"stored")]);
  for(const [name,root] of layers){
    if(!root) continue;
    const h=document.createElement("div"); h.className="layer"; h.textContent=`${name} · ${countNodes(root)-1} items`; el.appendChild(h);
    const ul=document.createElement("ul"); root.kids.forEach(k=>ul.appendChild(renderNode(k))); el.appendChild(ul);
  }
  if(M.orphans.length){

    const ul=document.createElement("ul"); M.orphans.forEach(r=>ul.appendChild(renderNode({ref:r,kids:[]}))); el.appendChild(ul);

}

function highlightTree(scroll){

    if(rr.top<tr.top || rr.bottom>tr.bottom) t.scrollTop += rr.top-tr.top - t.clientHeight/2; }
}

/* ---------- legend ---------- */
function renderLegend(){

/* ---------- page pane ---------- */
function svgEl(tag, attrs, parent){ const e=document.createElementNS(SVGNS,tag); for(const k in attrs) e.setAttribute(k,attrs[k]); if(parent) parent.appendChild(e); return e; }

  const M=S.M, vp=$("viewport"); vp.innerHTML="";

  if(img) svgEl("image",{href:img,x:0,y:0,width:p.w,height:p.h,preserveAspectRatio:"none"},svg);

      d.textContent=it.obj.text; fo.appendChild(d);
    }

      (it.obj.data?.table_cells||[]).forEach(c=>{ if(!c.bbox) return; const b=boxTL(c.bbox,p.h); const fs=Math.min(b.h*0.6,9);
        const fo=svgEl("foreignObject",{x:b.x+2,y:b.y,width:Math.max(1,b.w-4),height:b.h},svg); const d=document.createElement("div"); d.className="wire";
        d.style.cssText=b.h>18   /* hohe Zelle (mehrzeilig, z. B. Markdown-Tabellen): umbrechen */
          ? `font-size:${Math.min(9,fs*1.5)}px;line-height:1.2;padding-top:1px;white-space:normal;height:${b.h}px;${c.column_header?"font-weight:700;":""}`

  }
  // table cell grid
  if(S.showCells) for(const e of entries){ const it=M.items.get(e.ref); if(it.kind!=="tables") continue;
    (it.obj.data?.table_cells||[]).forEach(c=>{ if(!c.bbox) return; const b=boxTL(c.bbox,p.h);
      svgEl("rect",{x:b.x,y:b.y,width:b.w,height:b.h,fill:"none",stroke:COLORS.table,"stroke-opacity":.55,"stroke-width":.6,"vector-effect":"non-scaling-stroke"},svg); }); }
  // element boxes
  const centers=new Map();
  for(const e of entries){
    const it=M.items.get(e.ref), b=boxTL(e.pv.bbox,p.h), col=colorOf(it);
    centers.set(e.ref,{x:b.x+b.w/2,y:b.y+b.h/2,b});
    const g=svgEl("g",{class:"pagebox","data-ref":e.ref},svg);
    svgEl("rect",{class:"b",x:b.x,y:b.y,width:Math.max(b.w,1),height:Math.max(b.h,1),fill:col,"fill-opacity":.07,stroke:col,"stroke-width":1.4,"vector-effect":"non-scaling-stroke",...(it.layer==="furniture"?{"stroke-dasharray":"4 3"}:{})},g);
    g.addEventListener("click",ev=>{ ev.stopPropagation(); select(e.ref,"page"); });
    g.addEventListener("mousemove",ev=>showTip(ev,`<b>${esc(it.label)}</b> ${esc(it.ref)}<br>${esc(clip(it.text,160))}`));
    g.addEventListener("mouseleave",hideTip);
  }
  // relation arrows for the selection

  if(sel && S.rel){
    M.rels.filter(r=>r.from===sel||r.to===sel).forEach(r=>{
      const a=centers.get(r.from), b=centers.get(r.to); if(!a||!b) return;

    });
  }
  if(S.focusRefs.size){ // evidence boxes (all parts of a merged block)
    (M.byPage.get(S.page)||[]).filter(e=>S.focusRefs.has(e.ref)&&e.pv.bbox).forEach(e=>{ const b=boxTL(e.pv.bbox,p.h);
      svgEl("rect",{x:b.x-4,y:b.y-4,width:b.w+8,height:b.h+8,fill:"var(--focus)","fill-opacity":.1,style:"stroke:var(--focus)","stroke-width":2.5,"stroke-dasharray":"7 3","vector-effect":"non-scaling-stroke","pointer-events":"none"},svg); });
  }
  if(sel){ const it=M.items.get(sel);
    const own=(M.byPage.get(S.page)||[]).filter(e=>e.ref===sel);
    const boxes = own.length ? own.map(e=>boxTL(e.pv.bbox,p.h)) : descBoxes(sel,p);
    boxes.forEach(b=>svgEl("rect",{x:b.x-2,y:b.y-2,width:b.w+4,height:b.h+4,fill:"none",style:"stroke:var(--sel)","stroke-width":3,"vector-effect":"non-scaling-stroke","pointer-events":"none",...(own.length?{}:{"stroke-dasharray":"6 4"})},svg));

      const b=boxTL(e.pv.bbox,p.h), g=svgEl("g",{"pointer-events":"none"},svg);
      svgEl("circle",{cx:b.x-r-2,cy:b.y+r,r,fill:colorOf(M.items.get(e.ref))},g);
      const t=svgEl("text",{x:b.x-r-2,y:b.y+r,"text-anchor":"middle","dominant-baseline":"central","font-size":9.5/sc,"font-family":"IBM Plex Mono, monospace",fill:"#fff"},g); t.textContent=idx+1; }
  }
  vp.appendChild(svg);

}
function descBoxes(ref,p){ // group/root selected: outline all descendants on this page

    it.prov.forEach(pv=>{ if(pv.page_no===S.page&&pv.bbox) out.push(boxTL(pv.bbox,p.h)); }); if(!it.prov.length) it.children.forEach(go); };

/* ---------- graph pane ---------- */
function renderGraph(){
  const wrap=$("graph"); wrap.querySelector("svg")?.remove(); S.gpos.clear();
  if(typeof d3==="undefined"){ wrap.insertAdjacentHTML("afterbegin",'<div class="empty" style="padding:16px">The graph library could not load.</div>'); return; }
  const M=S.M;
  const roots=[outlineTree(M.bodyRef,S.mode)]; if(S.furn&&M.furnRef) roots.push(outlineTree(M.furnRef,"stored"));
  const vroot={ref:"#doc",kids:roots.filter(Boolean)};
  const h=d3.hierarchy(vroot,d=>d.kids);
  d3.tree().nodeSize([17,165]).separation((a,b)=>a.parent===b.parent?1:1.4)(h);
  const W=wrap.clientWidth, H=wrap.clientHeight;
  const svg=d3.select(wrap).insert("svg",":first-child").attr("viewBox",`0 0 ${W} ${H}`);
  const defs=svg.append("defs");
  for(const t in REL) defs.append("marker").attr("id","gm-"+t).attr("viewBox","0 0 10 10").attr("refX",9).attr("refY",5).attr("markerWidth",6).attr("markerHeight",6).attr("orient","auto-start-reverse").append("path").attr("d","M0,0L10,5L0,10z").attr("fill",REL[t].c);
  const g=svg.append("g");
  const nodes=h.descendants();
  nodes.forEach(n=>S.gpos.set(n.data.ref,{x:n.y,y:n.x}));
  g.append("g").selectAll("path").data(h.links()).join("path").attr("class","glink")
    .attr("d",d3.linkHorizontal().x(d=>d.y).y(d=>d.x));
  // reading order path
  if(S.ro){ const pts=M.order.map(r=>S.gpos.get(r)).filter(Boolean);
    g.append("path").attr("class","gorder").attr("d",d3.line().x(d=>d.x).y(d=>d.y).curve(d3.curveMonotoneY)(pts.map(p=>({x:p.x-10,y:p.y})))); }
  // relations
  const relG=g.append("g");
  if(S.rel) relG.selectAll("path").data(M.rels.filter(r=>S.gpos.has(r.from)&&S.gpos.has(r.to))).join("path")
    .attr("class","grel").attr("stroke",r=>REL[r.type].c).attr("marker-end",r=>`url(#gm-${r.type})`)
    .attr("d",r=>{ const a=S.gpos.get(r.from), b=S.gpos.get(r.to); const ax=a.x-6, bx=b.x-6, k=24+Math.abs(b.y-a.y)*0.35;
      return `M${ax},${a.y} C${ax-k},${a.y} ${bx-k},${b.y} ${bx},${b.y}`; })
    .append("title").text(r=>`${r.type}: ${r.from} → ${r.to}`);
  const ng=g.append("g").selectAll("g").data(nodes).join("g").attr("class","gnode").attr("transform",d=>`translate(${d.y},${d.x})`)
    .on("click",(ev,d)=>{ if(d.data.ref!=="#doc") select(d.data.ref,"graph"); });
  ng.each(function(d){ const it=M.items.get(d.data.ref), s=d3.select(this), col=d.data.ref==="#doc"?GROUP_COLOR:colorOf(it);
    if(d.data.ref==="#doc"||it.kind==="root"||it.kind==="groups") s.append("rect").attr("x",-5).attr("y",-5).attr("width",10).attr("height",10).attr("rx",2).attr("fill",col);
    else s.append("circle").attr("r",4.5).attr("fill",col);
    s.append("text").attr("x",8).attr("dy","0.32em").text(d.data.ref==="#doc"?(M.doc.name||"document"):shortLabel(it));
    s.append("title").text(d.data.ref==="#doc"?"document":`${it.label} · ${it.ref}\n${clip(it.text,200)}`); });
  S.gsel=g.append("circle").attr("r",9).attr("fill","none").style("stroke","var(--sel)").attr("stroke-width",2.5).attr("pointer-events","none").attr("visibility","hidden");
  S.g=g; S.svg=svg; S.relSel=relG.selectAll("path");
  S.zoomer=d3.zoom().scaleExtent([0.08,3]).on("zoom",e=>g.attr("transform",e.transform));
  svg.call(S.zoomer).on("dblclick.zoom",null);
  fitGraph(false);
  highlightGraph(false);
}
function fitGraph(anim){

  const k=Math.min(1.2, Math.max(0.08, Math.min((W-40)/bb.width, (H-40)/bb.height)));
  const t=d3.zoomIdentity.translate(W/2-k*(bb.x+bb.width/2), Math.max(20-k*bb.y, H/2-k*(bb.y+bb.height/2))).scale(k);

  ${it.obj.level!=null?`<dt>level</dt><dd>${it.obj.level}</dd>`:""}
  ${it.obj.marker?`<dt>marker</dt><dd>${esc(it.obj.marker)}</dd>`:""}
  ${idx!=null?`<dt>reading order</dt><dd>${idx+1} of ${M.order.length}</dd>`:""}
  ${provs?`<dt>bbox</dt><dd>${provs}</dd>`:""}</dl>`;
  if(it.kind!=="groups"&&it.kind!=="root"&&it.text) html+=`<div class="fulltext">${markQuote(it.text)}</div>`;
  if(it.kind==="tables") html+=tableHtml(it.obj);
  const ann=(it.obj.annotations||[]).flatMap(a=>(a.predicted_classes||[]).map(c=>`${c.class_name} ${(c.confidence*100).toFixed(0)}%`));
  if(ann.length) html+=`<div><span class="muted">Classified as</span> ${esc(ann.join(", "))}</div>`;
  const out=M.rels.filter(r=>r.from===it.ref), inc=M.rels.filter(r=>r.to===it.ref);
  const chips=[];
  if(it.parent && M.items.has(it.parent)) chips.push(chip(it.parent,"parent"));
  out.forEach(r=>chips.push(chip(r.to,r.type)));
  inc.forEach(r=>chips.push(chip(r.from,r.type+" of")));
  it.children.slice(0,14).forEach(c=>{ if(!out.some(r=>r.to===c)) chips.push(chip(c,"child")); });
  if(it.children.length>14) chips.push(`<span class="muted">+${it.children.length-14} more children</span>`);
  if(chips.length) html+=`<div class="rels">${chips.join("")}</div>`;
  html+=`<div class="rels">${idx>0?`<button class="chip" data-go="${esc(M.order[idx-1])}">← previous in reading order</button>`:""}${idx!=null&&idx<M.order.length-1?`<button class="chip" data-go="${esc(M.order[idx+1])}">next in reading order →</button>`:""}${FOCUS&&FOCUS.channel?`<button class="chip" id="toBasis" title="Dieses Element (bzw. den markierten Text) als Grundlage der nächsten Entscheidung an den Curator übergeben">→ als Grundlage übernehmen</button>`:""}<button class="chip" id="copyJson">Copy JSON</button></div>`;
  el.innerHTML=html;
  if($("toBasis")) $("toBasis").onclick=()=>toBasis(it);
  el.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>select(b.dataset.go,"details"));
  $("copyJson").onclick=()=>{ const txt=JSON.stringify(it.obj,(k,v)=>k==="uri"&&typeof v==="string"&&v.length>200?v.slice(0,60)+"…":v,2);
    try{ navigator.clipboard.writeText(txt).then(()=>toast("Copied element JSON"),()=>toast("Copy is blocked here")); }catch(e){ toast("Copy is blocked here"); } };
}
function tableHtml(t){
  const d=t.data; if(!d) return "";
  const nr=Math.min(d.num_rows||0,40), nc=d.num_cols||0; if(!nr||!nc) return "";
  const cells=d.table_cells||[]; const grid=[...Array(nr)].map(()=>Array(nc).fill(null));
  cells.forEach(c=>{ const r=c.start_row_offset_idx, k=c.start_col_offset_idx; if(r<nr&&k<nc&&grid[r][k]==null){ grid[r][k]=c; for(let i=r;i<Math.min(c.end_row_offset_idx,nr);i++) for(let j=k;j<Math.min(c.end_col_offset_idx,nc);j++) if(i!==r||j!==k) grid[i][j]=false; } });
  const rows=grid.map(row=>"<tr>"+row.map(c=>c===false?"":c==null?"<td></td>":`<${c.column_header?"th":"td"}${c.row_span>1?` rowspan="${c.row_span}"`:""}${c.col_span>1?` colspan="${c.col_span}"`:""}>${esc(c.text)}</${c.column_header?"th":"td"}>`).join("")+"</tr>").join("");
  return `<div class="tbl-wrap"><table>${rows}</table></div>`;
}

/* ---------- selection (keeps the three views in sync) ---------- */
function select(ref, src){
  if(!S.M.items.has(ref)) return;
  S.sel=ref;
  if(src!=="page"){ const pn=firstPage(ref); if(pn!=null && S.M.pages.has(pn)) S.page=pn; S._scrollToSel=true; }
  renderPage(); ensurePdfPage();
  highlightTree(src!=="tree");
  highlightGraph(src!=="graph");
  renderDetails();
}

/* ---------- loading ---------- */
function loadDoc(doc, name){
  if(!doc || typeof doc!=="object" || (!doc.body && !doc.texts)){ toast("This file has no body or texts, so it does not look like a DoclingDocument export."); return; }
  S.M=buildModel(doc); S.sel=null; S.page=S.M.pageNos[0]??1; S.zoom=null; S.hidden.clear(); S.pdfImgs={}; S.pdf=null;
  $("docname").textContent = doc.name || doc.origin?.filename || name || "untitled";
  const n=k=>Array.isArray(doc[k])?doc[k].length:0;
  $("stats").innerHTML=[["pages",S.M.pageNos.length],["texts",n("texts")],["tables",n("tables")],["pictures",n("pictures")],["groups",n("groups")],["relations",S.M.rels.length]]
    .map(([k,v])=>`<span class="stat"><b>${v}</b> ${k}</span>`).join("");
  renderTree(); renderLegend(); renderPage(); renderGraph(); renderDetails();
  const first=S.M.order.find(r=>["title","section_header"].includes(S.M.items.get(r).label)) || S.M.order[0];
  if(first) select(first,"init");
}
async function readFile(f){
  if(/\.pdf$/i.test(f.name)||f.type==="application/pdf") return attachPdf(f);
  try{ loadDoc(JSON.parse(await f.text()), f.name); }catch(e){ toast("Could not parse JSON: "+e.message); }
}
function loadScript(src){ return new Promise((ok,bad)=>{ const s=document.createElement("script"); s.src=src; s.onload=ok; s.onerror=()=>bad(new Error("could not load "+src)); document.head.appendChild(s); }); }
async function attachPdf(f){
  if(!S.M){ toast("Open a Docling JSON first."); return; }
  try{
    toast("Reading PDF…");
    if(!window.pdfjsLib){ await loadScript(PDFJS+"pdf.worker.min.js"); await loadScript(PDFJS+"pdf.min.js"); pdfjsLib.GlobalWorkerOptions.workerSrc=PDFJS+"pdf.worker.min.js"; }
    const src = typeof f==="string" ? {url:f} : {data:new Uint8Array(await f.arrayBuffer())};   // File or URL
    S.pdf=await pdfjsLib.getDocument(src).promise; S.pdfImgs={};
    if(S.pdf.numPages!==S.M.pageNos.length) toast(`PDF has ${S.pdf.numPages} pages, the JSON has ${S.M.pageNos.length}. Boxes may not line up.`); else toast("PDF attached");
    ensurePdfPage();
  }catch(e){ toast("Could not render the PDF: "+e.message); }
}
async function ensurePdfPage(){
  const n=S.page; if(!S.pdf || S.pdfImgs[n] || n>S.pdf.numPages) return;
  S.pdfImgs[n]="pending";
  const pg=await S.pdf.getPage(n); const vpt=pg.getViewport({scale:2});
  const c=document.createElement("canvas"); c.width=vpt.width; c.height=vpt.height;
  await pg.render({canvasContext:c.getContext("2d"),viewport:vpt}).promise;
  S.pdfImgs[n]=c.toDataURL("image/jpeg",0.85);
  if(S.page===n) renderPage();
}
function quoteSpan(text, quote){ // [start,end] of the quote in text; merged blocks: the part that lies in this item
  const norm=x=>String(x||"").replace(/\s+/g," ").trim(); const T=norm(text).toLowerCase(), Q=norm(quote).toLowerCase();
  if(!T||!Q) return null;
  let i=T.indexOf(Q); if(i>=0) return [i,i+Q.length];
  const k=Math.min(40,Q.length);
  i=T.indexOf(Q.slice(0,k)); if(i>=0) return [i,Math.min(T.length,i+Q.length)];          // quote starts here
  const j=T.indexOf(Q.slice(-k)); if(j>=0) return [Math.max(0,j+k-Q.length),j+k];         // quote ends here
  if(T.length>=20 && Q.includes(T)) return [0,T.length];                                     // item lies inside the quote
  return null;
}
function markQuote(t){ const T=String(t).replace(/\s+/g," ").trim(), sp=S.quote?quoteSpan(T,S.quote):null;
  return sp ? esc(T.slice(0,sp[0]))+'<mark class="q">'+esc(T.slice(sp[0],sp[1]))+'</mark>'+esc(T.slice(sp[1])) : esc(t); }
let toastT; function toast(m){ const t=$("toast"); t.textContent=m; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>t.hidden=true,3200); }

/* ---------- wiring ---------- */
function toggleBtn(id,key,after){ const b=$(id); b.onclick=()=>{ S[key]=!S[key]; b.setAttribute("aria-pressed",S[key]); after(); }; }
$("fileJson").onchange=e=>{ const f=e.target.files[0]; if(f) readFile(f); e.target.value=""; };
$("filePdf").onchange=e=>{ const f=e.target.files[0]; if(f) attachPdf(f); e.target.value=""; };
$("btnSample").onclick=()=>boot();
const setMode=m=>{ S.mode=m; $("modeSections").setAttribute("aria-pressed",m==="sections"); $("modeStored").setAttribute("aria-pressed",m==="stored"); renderTree(); renderGraph(); highlightTree(true); };
$("modeSections").onclick=()=>setMode("sections"); $("modeStored").onclick=()=>setMode("stored");
toggleBtn("btnFurn","furn",()=>{ renderTree(); renderPage(); renderGraph(); highlightTree(false); });
toggleBtn("btnOrder","showOrder",renderPage); toggleBtn("btnCells","showCells",renderPage);
toggleBtn("btnRO","ro",renderGraph); toggleBtn("btnRel","rel",()=>{ renderGraph(); renderPage(); });
$("gFit").onclick=()=>fitGraph(true);
const goPage=d=>{ const i=S.M.pageNos.indexOf(S.page)+d; if(i>=0&&i<S.M.pageNos.length){ S.page=S.M.pageNos[i]; renderPage(); ensurePdfPage(); $("viewport").scrollTop=0; } };
$("pgPrev").onclick=()=>goPage(-1); $("pgNext").onclick=()=>goPage(1);
const curScale=()=>{ const p=S.M.pages.get(S.page); return S.zoom??Math.max(0.2,($("viewport").clientWidth-32)/p.w); };
$("zIn").onclick=()=>{ S.zoom=Math.min(6,curScale()*1.25); renderPage(); };
$("zOut").onclick=()=>{ S.zoom=Math.max(0.2,curScale()/1.25); renderPage(); };
$("zFit").onclick=()=>{ S.zoom=null; renderPage(); };
document.addEventListener("keydown",e=>{
  if(e.target.closest?.(".splitter,.hsplit")) return;
  if(!S.M || /INPUT|TEXTAREA/.test(e.target.tagName)) return;
  const i=S.M.orderIdx.get(S.sel);
  if(e.key==="ArrowRight"){ if(i==null) select(S.M.order[0],"key"); else if(i<S.M.order.length-1) select(S.M.order[i+1],"key"); e.preventDefault(); }
  else if(e.key==="ArrowLeft"){ if(i>0) select(S.M.order[i-1],"key"); e.preventDefault(); }
  else if(e.key==="PageDown"){ goPage(1); e.preventDefault(); } else if(e.key==="PageUp"){ goPage(-1); e.preventDefault(); }
});
let dragDepth=0;
addEventListener("dragenter",e=>{ e.preventDefault(); dragDepth++; $("drop").hidden=false; });
addEventListener("dragleave",()=>{ if(--dragDepth<=0){ dragDepth=0; $("drop").hidden=true; } });
addEventListener("dragover",e=>e.preventDefault());
addEventListener("drop",e=>{ e.preventDefault(); dragDepth=0; $("drop").hidden=true; [...(e.dataTransfer?.files||[])].sort((a,b)=>/pdf$/i.test(a.name)-/pdf$/i.test(b.name)).reduce((p,f)=>p.then(()=>readFile(f)),Promise.resolve()); });
/* ---------- flexible tiles: resize, hide, maximize ---------- */
const PANES=[...document.querySelectorAll(".grid>.pane")];
const MINW={outline:200,page:280,graph:240};
const LKEY="dsv-layout-v1";
const DEF={w:{outline:300,page:620,graph:520},hidden:[],max:null,detH:null};
let LY=JSON.parse(JSON.stringify(DEF));
try{ const saved=JSON.parse(localStorage.getItem(LKEY)||"null"); if(saved&&saved.w) LY={...LY,...saved,w:{...LY.w,...saved.w}}; }catch(e){}
const saveLayout=()=>{ try{ localStorage.setItem(LKEY,JSON.stringify(LY)); }catch(e){} };
function visiblePanes(){ return PANES.filter(p=>LY.max ? p.dataset.key===LY.max : !LY.hidden.includes(p.dataset.key)); }
function applyLayout(){
  S.refit=true;
  const grid=document.querySelector(".grid");
  grid.querySelectorAll(".splitter").forEach(s=>s.remove());
  const vis=visiblePanes();
  PANES.forEach(p=>{ p.hidden=!vis.includes(p); p.style.flex=`${LY.w[p.dataset.key]} 1 0px`; });
  vis.slice(0,-1).forEach((p,i)=>{ const s=document.createElement("div"); s.className="splitter"; s.tabIndex=0;
    s.setAttribute("role","separator"); s.setAttribute("aria-orientation","vertical"); s.title="Drag to resize · double-click to split evenly";
    s.setAttribute("aria-label",`${p.dataset.key} | ${vis[i+1].dataset.key}`); s.setAttribute("aria-valuemin","0"); s.setAttribute("aria-valuemax","100");
    const ges=LY.w[p.dataset.key]+LY.w[vis[i+1].dataset.key]; s.setAttribute("aria-valuenow",String(Math.round(100*LY.w[p.dataset.key]/(ges||1))));
    p.after(s); wireColSplit(s,p,vis[i+1]); });
  document.querySelectorAll("[data-toggle]").forEach(b=>b.setAttribute("aria-pressed",String(!LY.hidden.includes(b.dataset.toggle)&&(!LY.max||LY.max===b.dataset.toggle))));
  document.querySelectorAll(".pmax").forEach(b=>{ const on=LY.max===b.dataset.pane; b.setAttribute("aria-pressed",String(on)); b.textContent=on?"⤡":"⤢"; b.title=on?"Restore panels":"Maximize"; });
  if(LY.detH) $("paneOutline").style.setProperty("--detH",LY.detH+"px"); else $("paneOutline").style.removeProperty("--detH");
}
function snapshotWidths(){ visiblePanes().forEach(p=>{ LY.w[p.dataset.key]=p.getBoundingClientRect().width; }); }
function dragging(on,dir){ document.body.classList.toggle("resizing",on); document.body.classList.toggle(dir,on); }
function wireColSplit(s,a,b){
  const ka=a.dataset.key, kb=b.dataset.key;
  const setA=wa=>{ const total=LY.w[ka]+LY.w[kb]; wa=Math.max(MINW[ka],Math.min(total-MINW[kb],wa)); LY.w[ka]=wa; LY.w[kb]=total-wa; a.style.flex=`${LY.w[ka]} 1 0px`; b.style.flex=`${LY.w[kb]} 1 0px`; };
  s.addEventListener("pointerdown",e=>{ e.preventDefault(); snapshotWidths(); PANES.forEach(p=>p.style.flex=`${LY.w[p.dataset.key]} 1 0px`);
    const x0=e.clientX, w0=LY.w[ka]; s.setPointerCapture(e.pointerId); s.classList.add("drag"); dragging(true,"col");
    const mv=ev=>setA(w0+ev.clientX-x0);
    const up=()=>{ s.removeEventListener("pointermove",mv); s.removeEventListener("pointerup",up); s.removeEventListener("pointercancel",up); s.classList.remove("drag"); dragging(false,"col"); saveLayout(); };
    s.addEventListener("pointermove",mv); s.addEventListener("pointerup",up); s.addEventListener("pointercancel",up); });
  s.addEventListener("dblclick",()=>{ snapshotWidths(); const t=LY.w[ka]+LY.w[kb]; setA(t/2); saveLayout(); });
  s.addEventListener("keydown",e=>{ if(e.key!=="ArrowLeft"&&e.key!=="ArrowRight") return; e.preventDefault(); snapshotWidths(); setA(LY.w[ka]+(e.key==="ArrowLeft"?-32:32)); saveLayout(); });
}
(function wireRowSplit(){
  const s=$("hsplit"), pane=$("paneOutline");
  const setH=h=>{ const r=pane.getBoundingClientRect(); h=Math.max(70,Math.min(r.height-150,h)); LY.detH=Math.round(h); pane.style.setProperty("--detH",LY.detH+"px");
    s.setAttribute("aria-valuenow",String(Math.round(100*LY.detH/(r.height||1)))); };
  s.addEventListener("pointerdown",e=>{ e.preventDefault(); s.setPointerCapture(e.pointerId); s.classList.add("drag"); dragging(true,"row");
    const mv=ev=>setH(pane.getBoundingClientRect().bottom-ev.clientY-4);
    const up=()=>{ s.removeEventListener("pointermove",mv); s.removeEventListener("pointerup",up); s.removeEventListener("pointercancel",up); s.classList.remove("drag"); dragging(false,"row"); saveLayout(); };
    s.addEventListener("pointermove",mv); s.addEventListener("pointerup",up); s.addEventListener("pointercancel",up); });
  s.addEventListener("dblclick",()=>{ LY.detH=null; applyLayout(); saveLayout(); });
  s.addEventListener("keydown",e=>{ if(e.key!=="ArrowUp"&&e.key!=="ArrowDown") return; e.preventDefault(); setH($("details").getBoundingClientRect().height+(e.key==="ArrowUp"?24:-24)); saveLayout(); });
})();
document.querySelectorAll("[data-toggle]").forEach(b=>b.onclick=()=>{
  const k=b.dataset.toggle;
  if(LY.max){ LY.max=null; LY.hidden=PANES.map(p=>p.dataset.key).filter(x=>x!==k); }
  else if(LY.hidden.includes(k)) LY.hidden=LY.hidden.filter(x=>x!==k);
  else if(PANES.length-LY.hidden.length<=1){ toast("At least one panel stays visible."); return; }
  else LY.hidden.push(k);
  applyLayout(); saveLayout();
});
document.querySelectorAll(".pmax").forEach(b=>b.onclick=()=>{ LY.max = LY.max===b.dataset.pane ? null : b.dataset.pane; applyLayout(); saveLayout(); });
$("layoutReset").onclick=()=>{ LY=JSON.parse(JSON.stringify(DEF)); applyLayout(); saveLayout(); };
applyLayout();
// Re-fit page and graph whenever their tiles change size (drag, hide, maximize, window resize)
let rT, lastG={w:0,h:0};
const ro=new ResizeObserver(()=>{ clearTimeout(rT); rT=setTimeout(()=>{ if(!S.M) return;
  if(S.zoom==null && !$("panePage").hidden) renderPage();
  const gw=$("graph"), W=gw.clientWidth, H=gw.clientHeight, sv=gw.querySelector("svg");
  if(sv && W && H && (W!==lastG.w || H!==lastG.h)){ sv.setAttribute("viewBox",`0 0 ${W} ${H}`);
    if(!lastG.w || !lastG.h || S.refit) fitGraph(false);
    else { const t=d3.zoomTransform(S.svg.node()); S.svg.call(S.zoomer.transform, t.translate((W-lastG.w)/2/t.k,(H-lastG.h)/2/t.k)); } }
  S.refit=false;
  lastG={w:W,h:H}; },60); });
[$("viewport"),$("graph")].forEach(el=>ro.observe(el));

renderGraphKey();
/* ---------- hand an element to the curator as basis of a decision (FOCUS.channel) ---------- */
let lastSel="";
document.addEventListener("selectionchange",()=>{ const t=String(window.getSelection()||"").replace(/\s+/g," ").trim(); if(t) lastSel=t; });
function toBasis(it){
  if(!FOCUS||!FOCUS.channel||!it) return;
  let z=lastSel && it.text && it.text.replace(/\s+/g," ").includes(lastSel) ? lastSel : "";
  if(!z && S.quote){ const sp=quoteSpan(it.text,S.quote); if(sp) z=String(it.text).replace(/\s+/g," ").trim().slice(sp[0],sp[1]); }
  const msg={art:"dokument", doc:FOCUS.doc, ref:it.ref};
  const m=(FOCUS.marks||[]).find(x=>(x.refs||[]).includes(it.ref));
  if(m && m.id && m.id.includes(":blk:")){ msg.element=m.id; msg.citation=m.citation; }
  if(z) msg.zitat=z.slice(0,600);
  if(!msg.citation) msg.text=clip(it.text,120);
  try{ const ch=new BroadcastChannel(FOCUS.channel); ch.postMessage(msg); ch.close(); toast("An den Curator übergeben"+(z?" (mit Zitat)":"")); }
  catch(e){ toast("Übergabe nicht möglich: "+e.message); }
}

/* ---------- evidence focus ---------- */
function applyFocus(i){
  const marks=(FOCUS&&FOCUS.marks)||[]; if(!marks.length||!S.M) return;
  S.mark=(i+marks.length)%marks.length; const m=marks[S.mark];
  const refs=(m.refs||[]).filter(r=>S.M.items.has(r));
  S.focusRefs=new Set(refs); S.quote=m.quote||"";
  const bar=$("focusbar"); bar.hidden=false;
  bar.innerHTML=`<span class="ft">${esc(FOCUS.title||"Beleg")}</span>${marks.length>1?`<button id="fPrev" aria-label="voriger Beleg">‹</button><span class="fc">${S.mark+1} / ${marks.length}</span><button id="fNext" aria-label="nächster Beleg">›</button>`:""}`+
    `<span class="fc">${esc(m.citation||m.refs?.[0]||"")}</span>${m.label&&!String(FOCUS.title||"").startsWith(m.label)?`<span class="fc">${esc(m.label)}</span>`:""}`+
    `<span class="fq" title="${esc(m.quote||m.text||"")}">${m.quote?"„"+esc(m.quote)+"“":esc(clip(m.text||"",200))}</span>`+
    `<button id="fGo" title="Beleg wieder auswählen">zum Beleg</button>`;
  if($("fPrev")){ $("fPrev").onclick=()=>applyFocus(S.mark-1); $("fNext").onclick=()=>applyFocus(S.mark+1); }
  $("fGo").onclick=()=>applyFocus(S.mark);
  if(refs.length) select((m.quote&&refs.find(r=>quoteSpan(S.M.items.get(r).text,m.quote)))||refs[0],"focus");
  else { if(m.page!=null&&S.M.pages.has(m.page)){ S.page=m.page; renderPage(); ensurePdfPage(); } highlightTree(false);
    if((m.refs||[]).length) toast("Verweis nicht im Docling-JSON (andere Fassung?): "+m.refs.join(", ")); }
  if(FOCUS.notice) toast(FOCUS.notice);
}
async function boot(){
  if(SAMPLE) loadDoc(SAMPLE,"embedded");
  else if(SRC){ try{ toast("Lade Docling-JSON …"); const r=await fetch(SRC); if(!r.ok) throw new Error(r.status+" "+r.statusText); loadDoc(await r.json(), FOCUS&&FOCUS.name); $("toast").hidden=true; }
    catch(e){ toast("Docling-JSON nicht geladen: "+e.message); return; } }
  else { toast("Open a Docling JSON export to start."); return; }
  if(FOCUS){ applyFocus(FOCUS.start||0); if(FOCUS.pdf) attachPdf(FOCUS.pdf); }
  else focusFromHash();
}
/* ---------- #ref=#/texts/15 in der Adresse: Element wählen (statische Seiten, z. B. öffentliche Demo) ---------- */
function focusFromHash(){
  const m=/(?:^#|&)ref=([^&]+)/.exec(location.hash||""); if(!m||!S.M) return;
  const ref=decodeURIComponent(m[1]); if(S.M.items.has(ref)) select(ref,"init");
}
window.addEventListener("hashchange", focusFromHash);
boot();
})();
